<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Minimal Test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: monospace;
      font-size: 22px;
      color: #00ffcc;
      z-index: 999;
      display: none;
    }

    #result {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      font-family: monospace;
      font-size: 30px;
      color: #ffcc00;
      display: none;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="hud">⏱ 00:00.00</div>
<div id="result"></div>

<a-scene background="color:#0a0a1a">

  <!-- 必須 cursor（不然 click = 不存在） -->
  <a-entity cursor="rayOrigin: mouse"
            raycaster="objects: .clickable"></a-entity>

  <!-- camera（VR 可以轉視角） -->
  <a-entity id="camRig">
    <a-entity camera
              look-controls
              position="0 1.6 0"></a-entity>
  </a-entity>

  <!-- START -->
  <a-entity id="startBtn" position="0 1.6 -2">
    <a-plane class="clickable"
             id="start"
             width="1.2"
             height="0.5"
             color="#003344"></a-plane>

    <a-text value="START"
            align="center"
            position="0 0 0.1"
            color="#00ffcc"></a-text>
  </a-entity>

</a-scene>

<script>
let running = false;
let startTime = 0;

const hud = document.getElementById("hud");
const result = document.getElementById("result");

function format(ms){
  return new Date(ms).toISOString().substr(14,9);
}

AFRAME.registerComponent("timer",{
  tick:function(){
    if(!running) return;
    hud.textContent = "⏱ " + format(performance.now()-startTime);
  }
});

document.querySelector("a-scene").setAttribute("timer","");

document.getElementById("start").addEventListener("click", () => {
  running = true;
  startTime = performance.now();

  hud.style.display = "block";
  document.getElementById("startBtn").setAttribute("visible", false);
});

</script>

</body>
</html>
